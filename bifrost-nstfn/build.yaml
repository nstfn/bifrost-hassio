# https://developers.home-assistant.io/docs/add-ons/configuration#add-on-dockerfile
#
# Image published by .github/workflows/docker-publish.yml of nstfn/bifrost on a
# push to the branch nstfn/main. Tags: nstfn-main-latest and nstfn-main-YYYY-MM-DD.
# The GHCR package must be public, or the supervisor cannot pull it.
build_from:
  # TODO(placeholder): replace YYYY-MM-DD with the date tag of the published build.
  aarch64: "ghcr.io/nstfn/bifrost:nstfn-main-YYYY-MM-DD"
labels:
  org.opencontainers.image.title: "Home Assistant Add-on: Bifrost (nstfn)"
  org.opencontainers.image.description: "Hue bridge emulator backed by Zigbee2MQTT (personal fork, no host network)."
  org.opencontainers.image.source: "https://github.com/nstfn/bifrost"
  org.opencontainers.image.licenses: "GNU GPLv3"
