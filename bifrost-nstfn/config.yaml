# https://developers.home-assistant.io/docs/add-ons/configuration#add-on-config
#
# Personal build of Bifrost (fork nstfn/bifrost, based on duvholt/bifrost).
# Differs from the upstream "bifrost" add-on: no host network. The add-on runs
# on the hassio network, so it reaches Zigbee2MQTT by its internal hostname,
# and publishes the bridge ports on the host instead.
name: Bifrost (nstfn)
# TODO(placeholder): keep in sync with the image tag in build.yaml.
version: nstfn-main-YYYY-MM-DD
slug: bifrost_nstfn
description: "Hue bridge emulator backed by Zigbee2MQTT (personal fork, no host network)."
url: "https://github.com/nstfn/bifrost"
arch:
  - aarch64
init: false

## Map config into container (writable): config is read from /config/bifrost
map:
  - config:rw

## No host_network: bifrost binds 0.0.0.0 inside the container
## (bridge.bind_ipaddress) and advertises bridge.ipaddress (the host address).
## Discovery (mdns, ssdp) does not reach the LAN: clients need the ip address.
ports:
  80/tcp: 80
  443/tcp: 443
  2100/udp: 2100
ports_description:
  80/tcp: "Hue API (http)"
  443/tcp: "Hue API (https)"
  2100/udp: "Hue Entertainment streaming (DTLS)"

## No NET_ADMIN: the process runs as root inside its own network namespace,
## which may bind ports below 1024 (CAP_NET_BIND_SERVICE is in Docker's
## default set). Upstream needed NET_ADMIN only with host networking.

## Same as upstream: the AppArmor profile is not maintained.
apparmor: false
